# Dependabot: ogni settimana controlla se le librerie usate hanno aggiornamenti
# (soprattutto di sicurezza) e propone una pull request su GitHub.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
